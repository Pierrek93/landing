<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My landing page</title>
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="banner">
    <div class="container">
      <h1>Crypto investing for everyone!</h1>
      <p style="margin-bottom: 30px">For those who want to get rich quick and retire by the beach.</p>
      <a href="" class="btn-primary" >Gamble Now!</a>
    </div>
  </div>

  <div class="container">
    <div class="content-title">
      <h2>How it works</h2>
    </div>

      <div class="cards">
        <div class="card">
          <img src="/css/images/sign-up.png" alt="Sign up logo" class="card-img">
          <h2>Create an account</h2>
          <p>Sign up with us</p>
        </div>
        <div class="card">
          <img src="/css/images/alt-coin.png" alt="an image of multiple alt coins" class="card-img">
          <h2>Invest in a coin</h2>
          <p>Choose a random alt-coin</p>
        </div>
        <div class="card">
          <img src="/css/images/pepe-happy.png" alt="pepe is happy on the beach" class="card-img">
          <h2>Cash in</h2>
          <p>Cash in and retire!</p>
        </div>
      </div>
  </div>

  <footer>
    <div class="container">
      <ul>
        <li target="_blank"><a href=""><i data-lucide="Facebook"></i></a></li>
        <li target="_blank"><a href=""><i data-lucide="Github"></i></a></li>
        <li target="_blank"><a href=""><i data-lucide="Instagram"></i></a></li>
        <li target="_blank"><a href=""><i data-lucide="Twitter"></i></a></li>
      </ul>
      <p>This website was coded at Le Wagon.</p>
    </div>
  </footer>



</body>
<script>
      lucide.createIcons();
</script>
</html>
